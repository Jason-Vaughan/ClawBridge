# =============================================================================
# BUILD STATE
# =============================================================================
# Runtime tracking during building. Updated after each chunk.

build_state:
  source_root: bridge/        # server.js + the v2/ broker modules

# =============================================================================
# ACTIVE BUILD PLAN (optional)
# =============================================================================
# Names the in-progress build plan when it isn't the conventional
# `artifacts/build-plan.md` — scope-named plans (`artifacts/build-plan-<scope>.md`)
# keep release-pending plans distinct under gitflow. The value is a path
# relative to `.prawduct/` (a repo-relative `.prawduct/...` spelling is
# tolerated). The Critic gate, plan-aware mode inference, regen-views, and
# chunk-ref verification all resolve the plan through this pointer; unset →
# `artifacts/build-plan.md`. A pointer to a file that doesn't exist means
# governance sees NO active plan — the session briefing warns loudly until
# it's fixed (STH-5P2W).
#
active_build_plan: artifacts/build-plan-cors-origin.md

# =============================================================================
# BUILD-PLAN REF ROOT (opt-in, unset by default)
# =============================================================================
# A second root that this repo's build-plan file refs may be written relative
# to. `verify-chunk-refs` tries the repo root first, then this.
#
# Set it when your plans name files the way they read from INSIDE a
# subdirectory rather than from the repo root — e.g. a repo that ships a
# plugin, an extension, or a bundled tool, whose plans say `lib/gates.py`
# meaning `plugin/lib/gates.py`. Without the declaration each such ref reports
# as a missing deliverable.
#
# DECLARED, never inferred: the verifier will not guess this from your layout,
# because "there is a directory that looks like a plugin root" is an ordinary
# layout rather than a statement of intent, and guessing would silently resolve
# a genuinely missing deliverable against an unrelated directory. Unset (the
# default) means the repo root is the only root. A value that escapes the repo,
# doesn't exist, or isn't a directory is ignored.
#
# build_plan_ref_root: plugin

# =============================================================================
# RISK SURFACES (opt-in)
# =============================================================================
# The paths where a missed defect costs your product the most — auth, payments,
# migrations, a public API contract, whatever yours are. Two consumers read the
# list: `prawduct-hook classify-diff-risk` (the review `tier`) and the Critic's
# roster derivation, which gives a diff touching any of them the deeper
# three-reviewer review at any size.
#
# **Declaring this opts you into the risk-keyed roster.** Leave it unset and you
# are never reviewed less than before: prawduct's framework-shaped defaults
# (`skills/`, `lib/gates*`, `bin/*hook*`, plus any contract paths you list in
# boundary-patterns.md) still escalate, and below those the older file-count rule
# stands (a coordinator at 5+ changed files). Declaring your own surfaces is what
# raises the size threshold to 12 judgeable files — prawduct will not review your
# high-risk changes more cheaply just because they are small.
#
# Pattern semantics: a trailing `/` is a directory prefix; anything else is an
# fnmatch glob (a plain path with no metacharacters is an exact match). An
# explicit empty list (`risk_surfaces: []`) is a deliberate "this product has
# no risk surfaces" opt-out and turns the tier check off.
#
# Declared deliberately. These are the paths where a defect does not merely
# misbehave — it auto-approves a destructive action on the operator's host, or
# lets a caller read outside the project root. classification.risk_profile rates
# the product medium overall precisely BECAUSE this list carries the high-risk
# path; a two-line diff to the parser must not be reviewed as a two-line diff.
risk_surfaces:
  - bridge/v2/permission-parser.js   # prompt detection + ANSI normalization
  - bridge/v2/policy.js              # envelope evaluation → the approve/deny call
  - bridge/v2/path-safety.js         # traversal/realpath/NUL guard for file reads
  - bridge/v2/sessions.js            # PTY keystroke injection, trust prompt, timers
  - bridge/server.js                 # bearer auth, routing, extension loading

# =============================================================================
# DERIVED VIEWS (enabled by default, v1.4+)
# =============================================================================
# When true (default), three derived views are regenerated from change-log.md
# tagged entries (see that file for the tag format):
#   * build-plan `## Status` block (checkboxes from `status=shipped` tags)
#   * `.prawduct/release-notes.md` (from `release=` tags)
#   * `scope_rollups:` block below (from `scope=` tags)
# Run `prawduct-hook regen-views` to apply.
# Set to `false` to opt out — Status becomes hand-edited and the other views
# are not produced.

# =============================================================================
# NORM REGISTRY
# =============================================================================
# Owner-ratified 2026-08-02. One norm ratified from candidate API-T5ST (additive,
# backward-compatible public contract changes; retroactive to 1.5.0, steady-state,
# zero violations to migrate). Home: .prawduct/artifacts/api-contract.md § Direction,
# with a pointer row in project-preferences.md's Enforcement table.
norm_registry_ratified: 2026-08-02 — 1 norm ratified (API-T5ST, api-contract § Direction)

views_enabled: true

# Scope rollups — derived view, populated by regen-views when views_enabled is
# true. Lists chunks (and releases) shipped under each scope rollup tag.
# Do not hand-edit — overwritten on next regen.
scope_rollups: {}

# =============================================================================
# COVERAGE EVIDENCE (opt-in, v1.4+)
# =============================================================================
# When true, the Critic requires every changed file the verifier can judge to
# appear in `.test-evidence.json`'s `changes_referenced` list (files it can't
# judge — non-code, symbol-less, deleted — are declared in `changes_unjudged`
# and reported, not gated) and scales severity language to the declared
# `coverage_level` (`referenced` floor vs. `executed` real). The reference
# verifier at `bin/test-reference-verify` emits the floor; products with
# non-trivial coverage concerns should plug in a stronger verifier. See
# `/prawduct:methodology building` "Coverage Evidence".
# Default off in v1.4 — schema is checked but content is not enforced.

coverage_required: false

# =============================================================================
# TEST EXECUTION (optional, gate-soundness)
# =============================================================================
# `prawduct-hook test-evidence record` defaults to running
# `sys.executable -m pytest` from the repo root and grepping a single `tests/`
# dir. When the repo's real shape differs (uv/venv-managed interpreter, no
# root pytest config, monorepo test trees), declare it — don't wrap it:
#
# test_command: uv run pytest --junit-xml={junit_xml} -q
#   The canonical suite invocation (the exact command CI runs), shlex-split
#   and run from the repo root. Must contain the `{junit_xml}` literal — the
#   hook substitutes its report path there. Shell operators (&&, |, FOO=1)
#   are not supported; point the command at a script for compound runs.
#   Caveat: the value is read by a YAML-comment-aware scalar reader, so a
#   literal `#` anywhere in the command truncates it — wrap such invocations
#   in a script too.
#
# test_commands:
#   - pipenv run pytest --junit-xml={junit_xml} -q
#   - npm run test:ci -- --junit --outputFile={junit_xml}
#   The multi-environment form (backend + web + mobile): one canonical
#   invocation per environment, each run under the same rules as
#   `test_command:` (shlex-split, mandatory `{junit_xml}`, `#` truncates);
#   counts aggregate across all reports into ONE evidence record, and any
#   launch failure or unparseable report fails the whole record. Declare it
#   ONLY as this block-sequence-of-strings shape (flow style `[a, b]` and
#   nested mappings are refused, not silently ignored). Mutually exclusive
#   with `test_command:`. Ingest path: repeat `--from-junit` once per report.
#
# tests_dirs: engine/tests server/tests
#   Whitespace-separated test trees for the coverage verifier (default:
#   `tests`). One verifier run unions discovery across all of them.

# Declared because the defaults do not fit this repo: the hook would otherwise
# run `python -m pytest` and grep a `tests/` directory, neither of which exists
# here. Verified 2026-08-02 — this exact invocation produced a parseable JUnit
# report for all 565 tests across 22 files, 0 failures.
test_command: npx vitest run --reporter=junit --outputFile={junit_xml}

# Two trees: bridge/__tests__ covers the server, prawduct argv, project files
# and the tools extension; bridge/v2/__tests__ covers the broker itself.
tests_dirs: bridge/__tests__ bridge/v2/__tests__

# =============================================================================
# OPERATOR VERIFICATION (opt-in, v1.4+)
# =============================================================================
# When true, `/pr create` BLOCKS if `.prawduct/operator-verification.md`
# has any entry with `**Status:** pending`. The queue records pre-merge
# human-verification items for visual / live-integration changes that
# automated tests can't fully cover. Drain via
# `prawduct-hook verify-operator-verification <VRF-id>` or
# override per-PR with `/pr create --accept-pending-verification "rationale"`.
# Default off in v1.4 — opt-in by setting `operator_verification_required: true`.

operator_verification_required: false

# =============================================================================
# API VERSIONING DECISION (advisory resolution fact, v2.2+)
# =============================================================================
# The committed "answer store" fact the `api-versioning` sync probe consults.
# When the product exposes a programmatic interface (detected from the code —
# web framework, OpenAPI/proto), the probe raises a dismissable, auto-resolving
# session advisory until a versioning decision is recorded. Set this to the
# decision summary (e.g. "uri-path-v1", "header", "none-internal-only",
# "deferred:<revisit-trigger>") to resolve it — it mirrors
# design_decisions.api_versioning_approach. Unset/absent = undecided. Recording
# "none-internal-only" resolves it; this is NOT a mandate to version.
#
# Resolves the api-versioning advisory. Both halves are now decided: the SCHEME
# (path-major /v2/* plus npm semver) shipped long ago, and the DEPRECATION POLICY
# was owner-ratified 2026-08-02 as a steady-state norm, retroactive to 1.5.0.
# Canonical text: .prawduct/artifacts/api-contract.md section Direction.
api_versioning_decided: uri-path-v2-plus-npm-semver; deprecation policy ratified 2026-08-02 (API-T5ST, retroactive to 1.5.0)

# =============================================================================
# BACKLOG (structured backlog resolution conditions, v1.7+)
# =============================================================================
# The shared "answer store" (committed) that backlog sync probes consult to
# know whether a migration nudge is still needed. The per-clone nag log lives
# in .prawduct/.advisories.json; these committed facts auto-resolve a
# teammate's advisory on next sync (see post-sync-advisory-spec.md §3.5, §7.1).
#
#   backlog_format_version  — set to 2 once `/backlog migrate` has converted
#                             items to the [PFX-XXXX] structured format. Unset
#                             (or absent) means legacy/unmigrated; the
#                             `legacy-backlog-format` probe may nudge.
#   backlog_prefixes        — OPTIONAL declared prefix vocabulary for /backlog
#                             validation (e.g. [STH, CRT, SYN]). Emergent by
#                             default; declare only if you want validation.
#
# Reserved for deferred backlog probes (v1.7 ships only legacy-backlog-format):
#   backlog_external_imports — list of external backlog files already audited
#                              via `/backlog import` (resolves external-detected).
#   backlog_last_groomed_at  — ISO-8601 of the last /backlog list|pick (resolves
#                              overdue-grooming).

# Items were authored directly in the [PFX-XXXX] structured format during
# onboarding — there is no legacy content to migrate.
backlog_format_version: 2
# backlog_prefixes: []
# backlog_external_imports: []
backlog_last_groomed_at: 2026-08-03

# =============================================================================
# CHANGE LOG
# =============================================================================
# Change log is in .prawduct/change-log.md (separate file to reduce merge conflicts).
# See that file for format and instructions.

# Distribution mode — set by /prawduct:migrate (v2.0.0 plugin cutover).
# `plugin` tells the legacy file-sync hook to stand down (Chunk 8).
distribution: plugin
